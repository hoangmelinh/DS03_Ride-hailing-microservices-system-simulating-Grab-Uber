server:
  port: 8085

spring:
  application:
    name: payment-service
  datasource:
    url: ${DB_PAYMENT_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${DB_PAYMENT_NAME:goride_payment}}
    username: ${POSTGRES_USER:goride_admin}
    password: ${POSTGRES_PASSWORD:goride_dev_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:goride_admin}
    password: ${RABBITMQ_PASSWORD:goride_dev_password}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 1000ms
          max-attempts: 3
          multiplier: 2.0
          max-interval: 10000ms
        default-requeue-rejected: false
    publisher-confirm-type: correlated
    publisher-returns: true

goride:
  rabbitmq:
    exchange: ${GORIDE_RABBITMQ_EXCHANGE:goride.events}
    dlx: ${GORIDE_RABBITMQ_DLX:goride.dead-letter.exchange}
    queues:
      trip-completed: ${GORIDE_QUEUE_PAYMENT_TRIP_COMPLETED:payment.trip-completed.q}
      dlq: ${GORIDE_QUEUE_PAYMENT_DLQ:payment.dead-letter.queue}
    routing-keys:
      trip-completed: ${GORIDE_RK_TRIP_COMPLETED:trip.completed}
      payment-succeeded: ${GORIDE_RK_PAYMENT_SUCCEEDED:payment.succeeded}
      payment-failed: ${GORIDE_RK_PAYMENT_FAILED:payment.failed}
      dlq: ${GORIDE_RK_PAYMENT_DLQ:payment.dead-letter}
  outbox:
    publisher:
      enabled: true
      fixed-delay-ms: 1000
      max-retries: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
