server:
  port: 8084

spring:
  application:
    name: matching-service
  datasource:
    url: ${DB_MATCHING_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${DB_MATCHING_NAME:goride_matching}}
    username: ${POSTGRES_USER:goride_admin}
    password: ${POSTGRES_PASSWORD:goride_dev_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:goride_admin}
    password: ${RABBITMQ_PASSWORD:goride_rabbit_password}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
          multiplier: 2.0
          max-interval: 4000ms

goride:
  rabbitmq:
    exchange: goride.events
    dlx: goride.dead-letter.exchange
    queues:
      trip-created: matching.trip-created.q
      dlq: matching.dead-letter.queue
    routing-keys:
      trip-created: trip.created
      dlq: matching.dead-letter
  clients:
    driver-service:
      base-url: ${DRIVER_SERVICE_URL:http://localhost:8082}
      connect-timeout-ms: 2000
      read-timeout-ms: 3000
    trip-service:
      base-url: ${TRIP_SERVICE_URL:http://localhost:8083}
      connect-timeout-ms: 2000
      read-timeout-ms: 3000
  matching:
    max-candidates: 10
    reserve-ttl-seconds: 30
    reserve-timeout-retries: 2
    assign-timeout-retries: 2
    recovery:
      enabled: ${MATCHING_RECOVERY_ENABLED:true}
      fixed-delay-ms: ${MATCHING_RECOVERY_INTERVAL_MS:5000}
      max-compensation-attempts: 5
      max-reconcile-attempts: 3
  outbox:
    publisher:
      enabled: ${OUTBOX_PUBLISHER_ENABLED:true}
      fixed-delay-ms: ${OUTBOX_PUBLISHER_INTERVAL_MS:1000}
      max-retries: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
