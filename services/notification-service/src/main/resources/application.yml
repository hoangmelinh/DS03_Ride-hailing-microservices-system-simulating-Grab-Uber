server:
  port: 8086

spring:
  application:
    name: notification-service
  datasource:
    url: ${DB_NOTIFICATION_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${DB_NOTIFICATION_NAME:goride_notification}}
    username: ${POSTGRES_USER:goride_admin}
    password: ${POSTGRES_PASSWORD:goride_dev_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:goride_admin}
    password: ${RABBITMQ_PASSWORD:goride_rabbit_password}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
          multiplier: 2.0
          max-interval: 4000ms

goride:
  rabbitmq:
    exchange: goride.events
    dlx: goride.dead-letter.exchange
    queues:
      events: notification.events.q
      dlq: notification.dead-letter.queue
    routing-keys:
      dlq: notification.dead-letter

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
