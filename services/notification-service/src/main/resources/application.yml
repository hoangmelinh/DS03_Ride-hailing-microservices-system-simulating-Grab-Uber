server:
  port: 8086

spring:
  application:
    name: notification-service
  datasource:
    url: ${DB_NOTIFICATION_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${DB_NOTIFICATION_NAME:goride_notification}}
    username: ${POSTGRES_USER:goride_admin}
    password: ${POSTGRES_PASSWORD:goride_dev_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:goride_admin}
    password: ${RABBITMQ_PASSWORD:goride_dev_password}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 1000ms
          max-attempts: 3
          multiplier: 2.0
          max-interval: 10000ms
        default-requeue-rejected: false

goride:
  rabbitmq:
    exchange: ${GORIDE_RABBITMQ_EXCHANGE:goride.events}
    dlx: ${GORIDE_RABBITMQ_DLX:goride.dead-letter.exchange}
    queues:
      notification-events: ${GORIDE_QUEUE_NOTIFICATION_EVENTS:notification.events.q}
      dlq: ${GORIDE_QUEUE_NOTIFICATION_DLQ:notification.dead-letter.queue}
    routing-keys:
      payment-succeeded: ${GORIDE_RK_PAYMENT_SUCCEEDED:payment.succeeded}
      payment-failed: ${GORIDE_RK_PAYMENT_FAILED:payment.failed}
      trip-completed: ${GORIDE_RK_TRIP_COMPLETED:trip.completed}
      trip-started: ${GORIDE_RK_TRIP_STARTED:trip.started}
      driver-assigned: ${GORIDE_RK_DRIVER_ASSIGNED:trip.driver-assigned}
      dlq: ${GORIDE_RK_NOTIFICATION_DLQ:notification.dead-letter}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
