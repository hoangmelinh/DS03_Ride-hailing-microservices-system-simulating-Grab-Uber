openapi: 3.0.3
info:
  title: GoRide - Trip Service API
  description: REST API contract for trip lifecycle, passenger requests, driver assignment, fare estimation, and trip completion in GoRide Distributed System.
  version: 1.0.0
servers:
  - url: http://localhost:8083
    description: Local Trip Service Direct Port
  - url: http://localhost:8080/trip-service
    description: Via API Gateway

paths:
  /api/v1/trips:
    post:
      summary: Request a new trip ride
      description: |
        Creates a new ride request in REQUESTED status.
        Saves the initial status history and queues a Transactional Outbox event `trip.created`
        for matching and driver assignment in the same database transaction.
      operationId: createTrip
      parameters:
        - name: X-Correlation-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
        - name: X-User-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTripRequest'
      responses:
        '201':
          description: Trip successfully created and queued for matching
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripApiResponse'
        '400':
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'

  /api/v1/trips/{id}:
    get:
      summary: Get trip summary by ID
      operationId: getTripById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Trip details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripApiResponse'
        '404':
          description: Trip not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'

  /api/v1/trips/{id}/detail:
    get:
      summary: Get detailed trip with full status history
      operationId: getTripDetail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Trip detail with status history retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripDetailApiResponse'
        '404':
          description: Trip not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'

  /api/v1/trips/passenger/{passengerId}:
    get:
      summary: Query trips requested by a passenger
      operationId: getTripsByPassenger
      parameters:
        - name: passengerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated trip list retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageTripApiResponse'

  /api/v1/trips/estimate-fare:
    post:
      summary: Estimate distance and ride fare
      operationId: estimateFare
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstimateFareRequest'
      responses:
        '200':
          description: Fare estimation calculated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FareEstimateApiResponse'

  /api/v1/trips/{id}/assign:
    patch:
      summary: Assign driver to trip (Matching Saga)
      description: |
        Called by Matching Service Saga after driver reservation succeeds.
        Supports Idempotency-Key header. Sets status to DRIVER_ASSIGNED and queues outbox event `trip.driver-assigned`.
      operationId: assignDriver
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
        - name: X-Correlation-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignDriverRequest'
      responses:
        '200':
          description: Driver successfully assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripApiResponse'
        '400':
          description: Invalid trip state or driver ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'
        '404':
          description: Trip not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'

  /internal/trips/{id}/assign-driver:
    post:
      summary: Assign driver via internal REST endpoint
      description: Internal endpoint matching architecture.md specification. Identical semantics to PATCH /api/v1/trips/{id}/assign.
      operationId: assignDriverInternal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
        - name: X-Correlation-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignDriverRequest'
      responses:
        '200':
          description: Driver successfully assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripApiResponse'

  /api/v1/trips/{id}/accept:
    patch:
      summary: Driver accepts trip
      description: Transitions status from DRIVER_ASSIGNED to ACCEPTED. Queues outbox event `trip.accepted`.
      operationId: acceptTrip
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-User-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
        - name: X-Correlation-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Trip accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripApiResponse'

  /api/v1/trips/{id}/start:
    patch:
      summary: Driver starts trip
      description: Transitions status to IN_PROGRESS and updates startedAt. Queues outbox event `trip.started`.
      operationId: startTrip
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-User-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
        - name: X-Correlation-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Trip started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripApiResponse'

  /api/v1/trips/{id}/complete:
    patch:
      summary: Driver completes trip
      description: |
        Transitions status to COMPLETED and sets finalFare and completedAt.
        Queues outbox event `trip.completed` which triggers Payment Service and Notification Service.
      operationId: completeTrip
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-User-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
        - name: X-Correlation-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Trip completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripApiResponse'

  /api/v1/trips/{id}/cancel:
    patch:
      summary: Cancel trip
      description: Transitions status to CANCELLED. Queues outbox event `trip.cancelled`.
      operationId: cancelTrip
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-User-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
        - name: X-Correlation-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelTripRequest'
      responses:
        '200':
          description: Trip cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripApiResponse'

components:
  schemas:
    CreateTripRequest:
      type: object
      required:
        - pickupLatitude
        - pickupLongitude
        - destinationLatitude
        - destinationLongitude
      properties:
        passengerId:
          type: string
          format: uuid
        pickupLatitude:
          type: number
          format: double
        pickupLongitude:
          type: number
          format: double
        pickupAddress:
          type: string
        destinationLatitude:
          type: number
          format: double
        destinationLongitude:
          type: number
          format: double
        destinationAddress:
          type: string
        estimatedFare:
          type: number
        currency:
          type: string
          default: VND

    EstimateFareRequest:
      type: object
      required:
        - pickupLatitude
        - pickupLongitude
        - destinationLatitude
        - destinationLongitude
      properties:
        pickupLatitude:
          type: number
          format: double
        pickupLongitude:
          type: number
          format: double
        destinationLatitude:
          type: number
          format: double
        destinationLongitude:
          type: number
          format: double

    AssignDriverRequest:
      type: object
      required:
        - driverId
      properties:
        driverId:
          type: string
          format: uuid

    CancelTripRequest:
      type: object
      properties:
        reason:
          type: string

    TripResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        passengerId:
          type: string
          format: uuid
        driverId:
          type: string
          format: uuid
          nullable: true
        pickupLatitude:
          type: number
        pickupLongitude:
          type: number
        pickupAddress:
          type: string
        destinationLatitude:
          type: number
        destinationLongitude:
          type: number
        destinationAddress:
          type: string
        status:
          type: string
          enum: [REQUESTED, MATCHING, DRIVER_ASSIGNED, ACCEPTED, IN_PROGRESS, COMPLETED, PAYMENT_PENDING, PAID, PAYMENT_FAILED, CANCELLED]
        estimatedFare:
          type: number
        finalFare:
          type: number
          nullable: true
        currency:
          type: string
        requestedAt:
          type: string
          format: date-time
        assignedAt:
          type: string
          format: date-time
          nullable: true
        acceptedAt:
          type: string
          format: date-time
          nullable: true
        startedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        cancelledAt:
          type: string
          format: date-time
          nullable: true
        cancellationReason:
          type: string
          nullable: true

    TripStatusHistoryResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tripId:
          type: string
          format: uuid
        fromStatus:
          type: string
          nullable: true
        toStatus:
          type: string
        reason:
          type: string
        actorType:
          type: string
          enum: [USER, DRIVER, SYSTEM, ADMIN]
        actorId:
          type: string
          format: uuid
          nullable: true
        correlationId:
          type: string
          format: uuid
        changedAt:
          type: string
          format: date-time

    TripDetailResponse:
      type: object
      properties:
        trip:
          $ref: '#/components/schemas/TripResponse'
        history:
          type: array
          items:
            $ref: '#/components/schemas/TripStatusHistoryResponse'

    FareEstimateResponse:
      type: object
      properties:
        distanceKm:
          type: number
        estimatedFare:
          type: number
        currency:
          type: string
        baseFare:
          type: number
        ratePerKm:
          type: number

    TripApiResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/TripResponse'
        timestamp:
          type: string
          format: date-time

    TripDetailApiResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/TripDetailResponse'
        timestamp:
          type: string
          format: date-time

    FareEstimateApiResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/FareEstimateResponse'
        timestamp:
          type: string
          format: date-time

    PageTripApiResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/TripResponse'
            totalElements:
              type: integer
            totalPages:
              type: integer
        timestamp:
          type: string
          format: date-time

    ErrorApiResponse:
      type: object
      properties:
        success:
          type: boolean
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
        timestamp:
          type: string
          format: date-time
