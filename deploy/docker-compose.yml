services:
  postgres:
    image: postgres:16-alpine
    container_name: goride-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-goride_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-goride_dev_password}
      POSTGRES_DB: goride_user
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../infrastructure/postgres/init-multiple-dbs.sql:/docker-entrypoint-initdb.d/init-multiple-dbs.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-goride_admin} -d goride_user"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - goride-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: goride-rabbitmq
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - goride-network

  redis:
    image: redis:7.2-alpine
    container_name: goride-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - goride-network

networks:
  goride-network:
    name: goride-network
    driver: bridge

volumes:
  postgres_data:
    name: goride_postgres_data
  rabbitmq_data:
    name: goride_rabbitmq_data
  redis_data:
    name: goride_redis_data
